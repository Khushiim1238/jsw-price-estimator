<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JSW Neosteel Price Estimator</title>
    <meta name="description" content="Calculate and estimate prices for JSW Neosteel TMT bars.">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <link rel="apple-touch-icon" href="images.png">
    <link rel="icon" type="image/png" href="images.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="glass-header">
            <div style="display: flex; align-items: center; justify-content: center; position: relative; width: 100%;">
                <div class="logo" style="position: absolute; left: 0;">
                    <img src="images.png" alt="JSW Neosteel Logo" class="logo-img">
                </div>
                <h1>Price Estimator</h1>
                <button id="settingsBtn" class="settings-btn" title="Edit Base Prices" style="position: absolute; right: 0; background: none; border: none; cursor: pointer; color: var(--text-primary); transition: transform 0.2s;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main>
            <section class="customer-section">
                <div class="customer-inputs-row">
                    <div class="input-group">
                        <label for="customerName">Full Name</label>
                        <input type="text" id="customerName" placeholder="Enter customer name">
                    </div>
                    <div class="input-group">
                        <label for="customerPhone">WhatsApp Number</label>
                        <div class="phone-input-wrapper">
                            <span class="phone-prefix">+91</span>
                            <input type="tel" id="customerPhone" placeholder="9876543210" maxlength="10">
                        </div>
                    </div>
                </div>
                <br>
            </section>

            <section class="estimator-section glass-panel">
                <h2>Sections & Quantities</h2>
                <div class="items-list" id="itemsList">
                    <!-- Items will be injected via JS -->
                </div>
            </section>

            <section class="summary-section glass-panel">
                <h2>Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotalAmount">₹ 0</span>
                </div>

                <div class="summary-row discount-row">
                    <div class="discount-input-wrapper">
                        <label for="discountPercent">Discount</label>
                        <div class="input-suffix">
                            <input type="number" id="discountPercent" placeholder="0" min="0" max="100">
                            <span>%</span>
                        </div>
                    </div>
                    <span id="discountAmount" class="discount-value">- ₹ 0</span>
                </div>

                <div class="divider"></div>

                <div class="summary-row grand-total-row">
                    <span>Final Amount</span>
                    <span id="finalAmount">₹ 0</span>
                </div>
            </section>

            <div class="actions" style="display: flex; gap: 12px; flex-direction: column;">
                <button id="sendWhatsappBtn" class="primary-btn">
                    <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"
                        height="24" fill="currentColor">
                        <path
                            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.663-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                    </svg>
                    Send WhatsApp Text
                </button>
                <button id="sharePdfBtn" class="primary-btn pdf-btn" style="background: #ef4444; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Generate & Share PDF
                </button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h2 style="margin-bottom: 20px; color: var(--text-primary); text-align: center;">Edit Base Prices</h2>
            <div id="priceSettingsList" class="settings-list">
                <!-- JS will populate these inputs -->
            </div>
            <div class="modal-actions" style="display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end;">
                <button id="cancelSettingsBtn" class="primary-btn" style="background: transparent; border: 1px solid var(--input-border); color: var(--text-primary);">Cancel</button>
                <button id="saveSettingsBtn" class="primary-btn">Save Prices</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay" style="z-index: 1001;">
        <div class="modal-content glass-panel" style="text-align: center; max-width: 350px;">
            <div style="color: #fbbf24; margin-bottom: 16px; display: flex; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h2 style="margin-bottom: 12px; color: var(--text-primary); font-size: 1.2rem;">Confirm Changes</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">Are you sure you want to update the base prices? This will affect all future calculations.</p>
            <div class="modal-actions" style="display: flex; gap: 12px; justify-content: center;">
                <button id="cancelConfirmBtn" class="primary-btn" style="background: transparent; border: 1px solid var(--input-border); color: var(--text-primary); flex: 1;">No, Cancel</button>
                <button id="confirmSaveBtn" class="primary-btn" style="flex: 1;">Yes, Update</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registered!');
                }).catch(err => {
                    console.log('Service Worker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
